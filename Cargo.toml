[package]
name = "orbit"
version = "0.1.0"
edition = "2024"

[dependencies]
# Slint supplies the launcher and GPU-accelerated FemtoVG renderer.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030"] }
# Read and write saved data and parse Hyprland's monitor information.
serde_json = "1"
# Derive the saved data format instead of parsing each field by hand.
serde = { version = "1", features = ["derive"] }

# Split quoted custom commands without invoking a shell.
shlex = "1.3"
# Decode common ICO favicons without enabling Slint's full image format set.
image = { version = "=0.25.10", default-features = false, features = ["ico"] }
# Open native file and directory choosers through the desktop portal.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

# Count visible characters, including joined emoji, in Letter icons.
unicode-segmentation = "1.13"
# Make TickTick HTTPS and JSON requests on Orbit's worker thread.
ureq = { version = "=3.4.1", default-features = false, features = ["json", "rustls"] }
# Keep the TickTick personal API token in Windows Credential Manager or Linux Secret Service.
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Activate KDE's Secret Service compatibility name before the standard keyring client connects.
dbus = "=0.9.12"

# Interpret task dates in the local calendar for Today and Next 7 Days.
[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock", "std"]

[build-dependencies]
# Compile the Slint layout into the binary.
slint-build = "=1.18.1"

[dev-dependencies]
# Exercise the real launcher key-event path without a desktop session.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
# Encode reproducible headless cursor captures as PNG files.
[dev-dependencies.image]
version = "=0.25.10"
default-features = false
features = ["png"]

[profile.release]
strip = true
